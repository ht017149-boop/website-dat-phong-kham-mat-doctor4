<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Doctor4</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca5;
        }

        .register-link {
            text-align: center;
            margin-top: 18px;
        }

        .register-link a {
            color: #1976d2;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Đăng nhập</h2>

    <form onsubmit="return loginUser(
        document.getElementById('username').value,
        document.getElementById('password').value
    );">

        <input
            type="text"
            id="username"
            placeholder="Tên đăng nhập"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mật khẩu"
            required
        >

        <button type="submit">
            Đăng nhập
        </button>

    </form>

    <div class="register-link">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký ngay</a>
    </div>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
